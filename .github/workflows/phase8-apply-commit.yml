name: Phase 8 Apply Commit

on:
  push:
    branches:
      - phase8-book-module-decoupling
    paths:
      - ".github/workflows/phase8-apply-commit.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-book-module-decoupling

      - name: Materialize Phase 8 source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/phase8-apply.mjs')
          s = p.read_text()
          s = s.replace('${label}', '\\${label}')
          s = s.replace(r'\\${name}', r'\\\${name}')
          p.write_text(s)
          PY
          node scripts/phase8-apply.mjs
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/book-module-decoupling.test.mjs')
          s = p.read_text()
          start = s.index('function model(name) {')
          end = s.index('\n}\n\n', start) + 3
          replacement = '''function model(name) {
  const start = schema.indexOf(`model ${name} {`);
  assert.ok(start >= 0, `model ${name} must exist`);
  const rest = schema.slice(start);
  const end = rest.indexOf("\\n}\\n");
  assert.ok(end >= 0, `model ${name} must have a closing brace`);
  return rest.slice(0, end + 2);
}'''
          p.write_text(s[:start] + replacement + s[end:])
          PY

      - name: Commit explicit Phase 8 files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prisma/schema.prisma
          git add prisma/migrations/20260908190000_decouple_book_metadata/migration.sql
          git add lib/book-metadata.ts
          git add 'app/api/book-metadata/[productId]/route.ts'
          git add scripts/verify-book-metadata.ts
          git add tests/book-module-decoupling.test.mjs
          git add docs/universal-ecommerce-phase8.md
          git add package.json
          git add .github/workflows/universal-ecommerce-phase7.yml
          git add .github/workflows/universal-ecommerce-phase8.yml
          git commit -m 'feat: implement Phase 8 book module decoupling'
          git push origin HEAD:phase8-book-module-decoupling
