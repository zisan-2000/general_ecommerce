name: Temporary StarTech Full Seed
on:
  pull_request:
    branches: [main]
    paths:
      - "startech_catalog_builder.py"
      - ".github/workflows/startech-full-seed-temp.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python startech_catalog_builder.py
      - run: python startech_catalog_builder.py --validate-only
      - uses: actions/upload-artifact@v4
        with:
          name: startech-full-seed
          path: |
            prisma/startech_productseed.json
            prisma/startech_productseed.stats.json
            download_startech_images.py
          retention-days: 1
