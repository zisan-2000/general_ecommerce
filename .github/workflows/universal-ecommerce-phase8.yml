name: Universal Ecommerce Phase 8

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "providers/**"
      - "scripts/**"
      - "tests/**"
      - "docs/universal-ecommerce-phase8.md"
      - "docs/universal-ecommerce/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/universal-ecommerce-phase8.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "providers/**"
      - "scripts/**"
      - "tests/**"
      - "docs/universal-ecommerce-phase8.md"
      - "docs/universal-ecommerce/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/universal-ecommerce-phase8.yml"

permissions:
  contents: read

concurrency:
  group: universal-ecommerce-phase8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Phase 1-8 release gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgresql://schema_validation:schema_validation@127.0.0.1:5432/schema_validation
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: schema_validation
          POSTGRES_PASSWORD: schema_validation
          POSTGRES_DB: schema_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_validation -d schema_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare pre-Phase-8 database fixture
        run: npx prisma db execute --url "$DATABASE_URL" --file tests/fixtures/phase8-legacy-schema.sql

      - name: Apply Phase 8 migrations
        run: |
          npx prisma db execute --url "$DATABASE_URL" --file prisma/migrations/20260908190000_decouple_book_metadata/migration.sql
          npx prisma db execute --url "$DATABASE_URL" --file prisma/migrations/20260908200000_restore_book_compatibility/migration.sql

      - name: Backfill book metadata compatibility representations
        run: npm run backfill:book-metadata

      - name: Verify book metadata database integrity
        run: npm run verify:book-metadata-db

      - name: Generate Next route types
        run: npx next typegen

      - name: Universal baseline
        run: npm run test:universal-baseline

      - name: Product and inventory regression suite
        run: npm run test:products && npm run test:order-idempotency

      - name: Universal Phase 2
        run: npm run test:universal-phase2

      - name: Universal Phase 3
        run: npm run test:universal-phase3

      - name: Universal Phase 4
        run: npm run test:universal-phase4

      - name: Universal Phase 5
        run: npm run test:universal-phase5

      - name: Universal Phase 6
        run: npm run test:universal-phase6

      - name: Universal Phase 7
        run: npm run test:universal-phase7

      - name: Phase 7 completion contract
        run: npx tsx --test tests/phase7-completion.test.mjs

      - name: Universal Phase 8
        run: npm run test:universal-phase8

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
