name: Phase 8 Apply Verify

on:
  push:
    branches:
      - phase8-book-module-decoupling

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      DATABASE_URL: postgresql://schema_validation:schema_validation@127.0.0.1:5432/schema_validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-book-module-decoupling
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply Phase 8 source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/phase8-apply.mjs')
          s = p.read_text()
          s = s.replace('${label}', '\\${label}')
          s = s.replace(r'\\${name}', r'\\\${name}')
          p.write_text(s)
          PY
          node scripts/phase8-apply.mjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Validate generated source
        run: |
          npx prisma validate
          npx prisma generate
          npx next typegen
          npm run test:universal-phase8
          npm run test:universal-baseline
          npm run test:products
          npm run test:order-idempotency
          npm run test:universal-phase2
          npm run test:universal-phase3
          npm run test:universal-phase4
          npm run test:universal-phase5
          npm run test:universal-phase6
          npm run test:universal-phase7
          npx tsx --test tests/phase7-completion.test.mjs
          npm run lint
          npx tsc --noEmit
          git diff --check

      - name: Commit Phase 8 implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prisma/schema.prisma
          git add prisma/migrations/20260908190000_decouple_book_metadata/migration.sql
          git add lib/book-metadata.ts
          git add 'app/api/book-metadata/[productId]/route.ts'
          git add scripts/verify-book-metadata.ts
          git add tests/book-module-decoupling.test.mjs
          git add docs/universal-ecommerce-phase8.md
          git add package.json
          git add .github/workflows/universal-ecommerce-phase7.yml
          git add .github/workflows/universal-ecommerce-phase8.yml
          git commit -m 'feat: implement Phase 8 book module decoupling'
          git push origin HEAD:phase8-book-module-decoupling
