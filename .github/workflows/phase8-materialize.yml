name: Phase 8 Materialize

on:
  push:
    branches:
      - phase8-book-module-decoupling
    paths:
      - ".github/workflows/phase8-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase8-book-module-decoupling
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate Phase 8 source
        run: node scripts/phase8-materialize.mjs
      - name: Commit generated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prisma/schema.prisma prisma/migrations/20260908190000_decouple_book_metadata/migration.sql
          git add lib/book-metadata.ts 'app/api/book-metadata/[productId]/route.ts'
          git add scripts/verify-book-metadata.ts tests/book-module-decoupling.test.mjs
          git add docs/universal-ecommerce-phase8.md package.json
          git add .github/workflows/universal-ecommerce-phase7.yml .github/workflows/universal-ecommerce-phase8.yml
          git commit -m 'feat: implement Phase 8 book module decoupling'
          git push origin HEAD:phase8-book-module-decoupling
