name: Temporary StarTech Seed Build

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/startech_live_seed_temp.py"
      - ".github/workflows/startech-seed-temp.yml"

permissions:
  contents: read

jobs:
  build-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/startech_live_seed_temp.py
      - uses: actions/upload-artifact@v4
        with:
          name: startech-productseed-full
          path: |
            startech_productseed.json
            startech_productseed.stats.json
          if-no-files-found: error
          retention-days: 1
